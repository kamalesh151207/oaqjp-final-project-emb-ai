<!DOCTYPE html>
<html>
<head>
    <title>Exam Result</title>
</head>
<body>

<h1>🎉 Congratulations</h1>

<h2>Your Result</h2>

<p>Your Score: {{ score }} / {{ total }}</p>

<hr>

<h2>Exam Results</h2>

{% for question in questions %}
    <h3>{{ question.text }}</h3>

    <ul>
    {% for choice in question.choice_set.all %}
        <li>
            {{ choice.text }}

            {% if choice.is_correct %}
                ✅ Correct Answer
            {% endif %}
        </li>
    {% endfor %}
    </ul>

{% endfor %}

</body>
</html>
